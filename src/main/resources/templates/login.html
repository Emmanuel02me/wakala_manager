<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Wakala Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="bg-primary">
    <div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
        <div class="card shadow-lg border-0" style="width: 400px;">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-shop text-primary" style="font-size: 3rem;"></i>
                    <h3 class="mt-2">Wakala Manager</h3>
                    <p class="text-muted">Ingia kwenye mfumo</p>
                </div>

                <div th:if="${error}" class="alert alert-danger">
                    <i class="bi bi-exclamation-triangle"></i>
                    <span th:text="${error}"></span>
                </div>
                <div th:if="${param.logout}" class="alert alert-success">
                    <i class="bi bi-check-circle"></i> Umetoka salama.
                </div>

                <form method="post" action="/login">
                    <input type="hidden" name="redirect" th:value="${redirect}">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" name="username" class="form-control" placeholder="Weka username" required
                                autofocus>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" name="password" class="form-control" placeholder="Weka password"
                                required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-box-arrow-in-right"></i> Ingia
                    </button>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
