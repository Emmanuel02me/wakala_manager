<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - Wakala Manager'">Wakala Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --info: #3b82f6;
            --dark: #1e293b;
            --gray: #64748b;
            --light: #f1f5f9;
        }

        * {
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e9ecf5 100%);
            min-height: 100vh;
        }

        .navbar-custom {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            box-shadow: 0 4px 20px rgba(79, 70, 229, 0.3);
            padding: 1rem 1.5rem;
        }

        .navbar-custom .navbar-brand {
            font-weight: 800;
            font-size: 1.4rem;
            letter-spacing: -0.5px;
        }

        .user-badge {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 0.5rem 1rem;
            border-radius: 50px;
            color: white;
            font-weight: 500;
        }

        .sidebar {
            background: white;
            min-height: calc(100vh - 80px);
            border-right: 1px solid #e2e8f0;
            padding: 1.5rem 0;
            box-shadow: 2px 0 20px rgba(0, 0, 0, 0.03);
        }

        .sidebar .nav-link {
            color: var(--gray);
            padding: 0.85rem 1.5rem;
            font-weight: 500;
            border-left: 3px solid transparent;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .sidebar .nav-link:hover {
            background: #f8fafc;
            color: var(--primary);
            border-left-color: var(--primary);
            transform: translateX(4px);
        }

        .sidebar .nav-link.active {
            background: linear-gradient(90deg, rgba(79, 70, 229, 0.1) 0%, transparent 100%);
            color: var(--primary);
            border-left-color: var(--primary);
            font-weight: 600;
        }

        .sidebar .nav-link i {
            font-size: 1.15rem;
        }

        .stat-card {
            border: none;
            border-radius: 20px;
            padding: 1.75rem;
            color: white;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 200px;
            height: 200px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
        }

        .stat-card.success {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }

        .stat-card.info {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        }

        .stat-card.warning {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
        }

        .stat-card.danger {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }

        .stat-card.primary {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
        }

        .stat-card .stat-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            opacity: 0.9;
            margin-bottom: 0.5rem;
        }

        .stat-card .stat-value {
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            position: relative;
            z-index: 1;
        }

        .stat-card .stat-icon {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            font-size: 2rem;
            opacity: 0.3;
        }

        .card-custom {
            border: none;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .card-custom:hover {
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .card-custom .card-header {
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            border-bottom: 1px solid #e2e8f0;
            padding: 1rem 1.5rem;
            font-weight: 600;
        }

        .btn-modern {
            border-radius: 10px;
            padding: 0.65rem 1.5rem;
            font-weight: 600;
            transition: all 0.25s ease;
            border: none;
        }

        .btn-modern:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        .btn-primary-modern {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
        }

        .btn-primary-modern:hover {
            color: white;
        }

        .table-modern {
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }

        .table-modern thead {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
        }

        .table-modern thead th {
            padding: 1rem;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: none;
        }

        .table-modern tbody tr {
            transition: background 0.2s ease;
            background: white;
        }

        .table-modern tbody tr:hover {
            background: #f8fafc;
        }

        .table-modern tbody td {
            padding: 1rem;
            vertical-align: middle;
            border-color: #e2e8f0;
        }

        .badge-status {
            padding: 0.4rem 0.9rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .page-header h1 {
            font-size: 1.85rem;
            font-weight: 800;
            color: var(--dark);
            margin: 0;
            letter-spacing: -0.5px;
        }

        .page-header .subtitle {
            color: var(--gray);
            font-size: 0.95rem;
            margin-top: 0.25rem;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-in {
            animation: fadeInUp 0.5s ease forwards;
        }

        .delay-1 {
            animation-delay: 0.1s;
        }

        .delay-2 {
            animation-delay: 0.2s;
        }

        .delay-3 {
            animation-delay: 0.3s;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--gray);
        }

        .empty-state i {
            font-size: 4rem;
            color: #cbd5e1;
            margin-bottom: 1rem;
        }
    </style>
</head>

<body>

    <!-- ═══ NAVBAR FRAGMENT ═══ -->
    <nav th:fragment="navbar(user)" class="navbar navbar-custom">
        <div class="container-fluid">
            <a class="navbar-brand text-white" href="/dashboard">
                <i class="bi bi-shop-window"></i> Wakala Manager
            </a>
            <div class="ms-auto d-flex align-items-center gap-2">
                <a th:href="@{/web/profile}" class="text-white text-decoration-none"></a>
                <div class="user-badge">
                    <i class="bi bi-person-circle"></i>
                    <span th:text="${user != null ? user.fullName : ''}"></span>
                    <span class="badge bg-light text-dark ms-1" th:text="${user != null ? user.role : ''}"></span>
                </div>
                <a href="/logout" class="btn btn-light btn-sm rounded-pill px-3">
                    <i class="bi bi-box-arrow-right"></i> Toka
                </a>
            </div>
        </div>
    </nav>

    <!-- ═══ SIDEBAR FRAGMENT ═══ -->
    <div th:fragment="sidebar(user, active)" class="col-md-2 sidebar p-0">
        <ul class="nav flex-column">
            <li class="nav-item">
                <a href="/dashboard" th:classappend="${active == 'dashboard'} ? 'active' : ''" class="nav-link">
                    <i class="bi bi-speedometer2"></i> Dashboard
                </a>
            </li>
            <li class="nav-item">
                <a href="/web/transactions" th:classappend="${active == 'transactions'} ? 'active' : ''"
                    class="nav-link">
                    <i class="bi bi-cash-stack"></i> Miamala
                </a>
            </li>
            <li class="nav-item">
                <a href="/web/expenses" th:classappend="${active == 'expenses'} ? 'active' : ''" class="nav-link">
                    <i class="bi bi-receipt"></i> Matumizi
                </a>
            </li>
            <li class="nav-item">
                <a href="/web/sessions" th:classappend="${active == 'sessions'} ? 'active' : ''" class="nav-link">
                    <i class="bi bi-calendar-check"></i> Vikao
                </a>
            </li>
            <li class="nav-item" th:if="${user != null and user.role.name() == 'OWNER'}">
                <a href="/web/providers" th:classappend="${active == 'providers'} ? 'active' : ''" class="nav-link">
                    <i class="bi bi-hdd-network"></i> Providers
                </a>
            </li>
            <li class="nav-item" th:if="${user != null and user.role.name() == 'OWNER'}">
                <a href="/web/owner-rules" th:classappend="${active == 'owner-rules'} ? 'active' : ''" class="nav-link">
                    <i class="bi bi-sliders"></i> Owner Rules
                </a>
            </li>
            <li class="nav-item" th:if="${user != null and user.role.name() == 'OWNER'}">
                <a href="/web/users" th:classappend="${active == 'users'} ? 'active' : ''" class="nav-link">
                    <i class="bi bi-people"></i> Watumiaji
                </a>
            </li>
            <li class="nav-item">
                <a href="/web/profile" th:classappend="${active == 'profile'} ? 'active' : ''" class="nav-link">
                    <i class="bi bi-person-circle"></i> Wasifu Wangu
                </a>
            </li>
        </ul>
    </div>

    <!-- ═══ SCRIPTS FRAGMENT ═══ -->
    <th:block th:fragment="scripts">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
        <script th:inline="javascript">
            // ═══ Auth Check — Zuia Back/Forward Baada ya Logout ═══
            (function () {
                var path = window.location.pathname;

                // Ruhusu login page na static resources
                if (path === '/login' || path.startsWith('/css')
                    || path.startsWith('/js') || path.startsWith('/images')
                    || path.startsWith('/api')) {
                    return;
                }

                function isLoggedIn() {
                    return document.cookie.split(';').some(function (c) {
                        return c.trim().indexOf('logged_in=') === 0;
                    });
                }

                function redirectToLogin() {
                    window.location.replace('/login');
                }

                // 1. Check ya kwanza
                if (!isLoggedIn()) {
                    redirectToLogin();
                    return;
                }

                // 2. Check ya pageshow (back/forward)
                window.addEventListener('pageshow', function (event) {
                    if (!isLoggedIn()) {
                        redirectToLogin();
                    }
                });

                // 3. Check ya visibility (tab switch)
                document.addEventListener('visibilitychange', function () {
                    if (!document.hidden && !isLoggedIn()) {
                        redirectToLogin();
                    }
                });

                // 4. Check ya focus
                window.addEventListener('focus', function () {
                    if (!isLoggedIn()) {
                        redirectToLogin();
                    }
                });

                // 5. Zuia back button
                history.pushState(null, '', location.href);
                window.addEventListener('popstate', function () {
                    if (!isLoggedIn()) {
                        redirectToLogin();
                    } else {
                        history.pushState(null, '', location.href);
                    }
                });
            })();

            // ═══ Auto-hide alerts ═══
            setTimeout(function () {
                document.querySelectorAll('.alert-dismissible').forEach(function (el) {
                    try {
                        new bootstrap.Alert(el).close();
                    } catch (e) { }
                });
            }, 5000);
        </script>
    </th:block>

</body>

</html>
