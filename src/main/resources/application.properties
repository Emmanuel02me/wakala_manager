# ============ APPLICATION ============

# ═══════════════════════════════════════
# DEVELOPMENT CONFIGURATION
# ═══════════════════════════════════════
spring.application.name=V1
server.port=8080

# ============ DATABASE (PostgreSQL) ============
spring.datasource.url=jdbc:postgresql://localhost:5432/wakala_db
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# ============ JPA / HIBERNATE ============
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ============ LOGGING ============
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.Wakala.v1=DEBUG

# ═══════════════════════════════════════
# JWT
# ═══════════════════════════════════════
jwt.secret=WakalaV1SuperSecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLongForHS256Algorithm2026
jwt.expiration=86400000
# 86400000 ms = 24 hours

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html